<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NexaAI Chatbot</title>

    <link rel="stylesheet" href="/chatbot.css">
</head>

<body>

    <div class="chat-container">

        <header>
            <h2>NexaAI <span>Medical Assistant</span></h2>
        </header>

        <div id="chatMessages">

            <div class="bot-message">
                Hello! I'm NexaAI. How can I help you today?
            </div>

        </div>

        <!-- Selected PDF Preview -->
        <div class="selected-file" id="selectedFile" hidden>

            <span id="fileName"></span>

            <button type="button" id="removeFile">✕</button>

        </div>

        <!-- Chat Input -->
        <div class="chat-input">

            <!-- Hidden PDF Input -->
            <input type="file" id="pdfInput" accept=".pdf,application/pdf" hidden>

            <!-- Attachment Button -->
            <button type="button" id="attachBtn" class="attach-btn" title="Attach PDF">
                📎
            </button>

            <!-- Message Input -->
            <textarea id="userMessage" placeholder="Ask NexaAI anything..." rows="1"></textarea>

            <!-- Send Button -->
            <button type="button" id="sendBtn">
                Send
            </button>

        </div>

        <p class="upload-note">
            Attach your medical report in PDF format (Maximum 10 MB).
        </p>

    </div>

    <!-- Markdown Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <!-- Chatbot JavaScript -->
    <script src="/js/chatbot.js"></script>

</body>

</html>
